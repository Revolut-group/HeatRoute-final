spring.application.name=heatroute
spring.main.banner-mode=off
spring.datasource.url=${HEATROUTE_JDBC_URL:jdbc:h2:file:./work/job-metadata;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${HEATROUTE_DB_USER:sa}
spring.datasource.password=${HEATROUTE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
server.port=${PORT:8080}
server.tomcat.max-swallow-size=-1
server.error.include-message=never
springdoc.default-produces-media-type=application/json
